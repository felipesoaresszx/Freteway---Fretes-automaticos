name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frete
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: frete
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frete -d frete"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      catalog-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frete_catalog
          POSTGRES_PASSWORD: ci-catalog-password
          POSTGRES_DB: frete_catalog
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U frete_catalog -d frete_catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://frete:ci-postgres-password@localhost:5432/frete
      MASTER_DATABASE_URL: postgresql+asyncpg://frete:ci-postgres-password@localhost:5432/frete
      CATALOG_DATABASE_URL: postgresql+asyncpg://frete_catalog:ci-catalog-password@localhost:5433/frete_catalog
      ENVIRONMENT: development
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credentials-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic -c alembic_catalog.ini upgrade head
      - run: alembic -x database_per_tenant=true upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
