name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frete
          POSTGRES_PASSWORD: frete_ci
          POSTGRES_DB: frete
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frete"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://frete:frete_ci@localhost:5432/frete
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: test "$(alembic heads | wc -l)" -eq 1
      - run: alembic upgrade head
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: false
          tags: freteway-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy Oracle Cloud
    runs-on: ubuntu-latest
    needs: [backend, frontend, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 40
    concurrency:
      group: freteway-production
      cancel-in-progress: false
    steps:
      - name: Configure restricted SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/freteway_deploy
          chmod 600 ~/.ssh/freteway_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested revision
        shell: bash
        env:
          SANKHYA_API_KEY: ${{ secrets.SANKHYA_API_KEY }}
        run: |
          if [[ ${#SANKHYA_API_KEY} -lt 32 ]]; then
            echo "GitHub Actions Secret SANKHYA_API_KEY ausente ou muito curto." >&2
            exit 1
          fi
          printf '%s\n' "$SANKHYA_API_KEY" | ssh -i ~/.ssh/freteway_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            ubuntu@64.181.183.229 deploy

          smoke_status="$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST https://modial-fretes.com.br/api/v1/integrations/sankhya/cotacao \
            --header 'Content-Type: application/json' \
            --header "X-API-Key: $SANKHYA_API_KEY" \
            --data '{"NUNOTA":"DEPLOY-SMOKE","CODEMP":"DEPLOY-SMOKE-INEXISTENTE","CepOrigem":"01001000","CepDestino":"30110000","VlrNota":1,"Volumes":[{"Quantidade":1,"Peso":1,"Altura":1,"Largura":1,"Comprimento":1}]}'
          )"
          if [[ "$smoke_status" != 422 ]]; then
            echo "Smoke test Sankhya falhou (HTTP $smoke_status; esperado 422 para CODEMP de teste)." >&2
            exit 1
          fi
