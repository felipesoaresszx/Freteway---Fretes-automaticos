services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frete
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: frete
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frete"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://frete:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/frete
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    security_opt:
      - no-new-privileges:true
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    command: sh -c "npm install --prefer-offline && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # n8n e playwright entram a partir do Sprint 7/8, conforme o plano de sprints.

volumes:
  postgres_data:
