AWSTemplateFormatVersion: '2010-09-09'
Description: Low-cost secure FreteWay application host connected to an existing private RDS
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RdsEndpoint:
    Type: String
    AllowedPattern: '^[A-Za-z0-9.-]+$'
  RdsSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:.*$'
  ArtifactBucketName:
    Type: String
  ArtifactKey:
    Type: String
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
Resources:
  SecretsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: FreteWay application secrets encryption key
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Application
          Value: FreteWay
        - Key: Environment
          Value: production

  AppDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: FreteWay PostgreSQL application user generated credentials
      KmsKeyId: !Ref SecretsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username":"freteway_app"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: FreteWay
        - Key: Environment
          Value: production

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: FreteWay JWT signing secret
      KmsKeyId: !Ref SecretsKey
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: FreteWay
        - Key: Environment
          Value: production

  CredentialsEncryptionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: FreteWay dedicated credentials encryption key
      KmsKeyId: !Ref SecretsKey
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: FreteWay
        - Key: Environment
          Value: production

  InitialAdminSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: FreteWay initial platform administrator credentials
      KmsKeyId: !Ref SecretsKey
      GenerateSecretString:
        SecretStringTemplate: '{"email":"admin@freteway.local"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'
      Tags:
        - Key: Application
          Value: FreteWay
        - Key: Environment
          Value: production

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: FreteWayRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${ArtifactKey}
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref AppDatabaseSecret
                  - !Ref JwtSecret
                  - !Ref CredentialsEncryptionSecret
                  - !Ref InitialAdminSecret
                  - !Ref RdsSecretArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  - !GetAtt SecretsKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FreteWay public HTTPS ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-web

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-ip

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t4g.small
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref WebSecurityGroup
        - !Ref RdsSecurityGroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-app
        - Key: Application
          Value: FreteWay
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          export AWS_REGION='${AWS::Region}'
          export ARTIFACT_BUCKET='${ArtifactBucketName}'
          export ARTIFACT_KEY='${ArtifactKey}'
          export RDS_ENDPOINT='${RdsEndpoint}'
          export RDS_SECRET_ARN='${RdsSecretArn}'
          export APP_DB_SECRET_ARN='${AppDatabaseSecret}'
          export JWT_SECRET_ARN='${JwtSecret}'
          export CREDENTIALS_KEY_ARN='${CredentialsEncryptionSecret}'
          export ADMIN_SECRET_ARN='${InitialAdminSecret}'
          export PUBLIC_IP='${ElasticIp}'
          dnf install -y awscli unzip
          aws s3 cp 's3://${ArtifactBucketName}/${ArtifactKey}' /tmp/freteway.zip --region '${AWS::Region}'
          unzip -p /tmp/freteway.zip app/infra/aws/bootstrap.sh > /tmp/bootstrap.sh
          chmod 700 /tmp/bootstrap.sh
          /tmp/bootstrap.sh

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref AppInstance

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: FreteWay EC2 high CPU for fifteen minutes
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  PublicUrl:
    Description: HTTPS URL for FreteWay
    Value: !Sub https://${ElasticIp}.sslip.io
  InstanceId:
    Description: EC2 instance managed through Systems Manager
    Value: !Ref AppInstance
  InitialAdminSecretArn:
    Description: Secrets Manager ARN containing initial administrator credentials
    Value: !Ref InitialAdminSecret
  JwtSecretArn:
    Description: Secrets Manager ARN containing the JWT signing secret
    Value: !Ref JwtSecret
  CredentialsEncryptionSecretArn:
    Description: Secrets Manager ARN containing the credentials encryption key
    Value: !Ref CredentialsEncryptionSecret
